name: EchoVault
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  EchoVault:
    type: application
    platform: iOS
    sources:
      - path: EchoVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EchoVault
        INFOPLIST_KEY_CFBundleDisplayName: EchoVault
        INFOPLIST_KEY_NSMicrophoneUsageDescription: EchoVault records audio only when you start a recording.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: EchoVault uses speech recognition only when you request a transcript.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  EchoVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EchoVaultTests
    dependencies:
      - target: EchoVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EchoVaultTests
        GENERATE_INFOPLIST_FILE: YES
