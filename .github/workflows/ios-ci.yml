name: iOS CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: xcodebuild -project EchoVault.xcodeproj -scheme EchoVault -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Ensure iOS simulator runtime is installed
        run: |
          if ! xcrun simctl list runtimes | grep -q 'iOS'; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Create and boot simulator
        id: simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | jq -r '.runtimes[] | select(.platform == "iOS" and .isAvailable == true) | .identifier' | sort -r | head -n 1)
          if [ -z "$RUNTIME" ]; then
            echo "No available iOS Simulator runtime found after installation." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          DEVICE_ID=$(xcrun simctl create "EchoVault CI iPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: xcodebuild test -project EchoVault.xcodeproj -scheme EchoVault -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" CODE_SIGNING_ALLOWED=NO
