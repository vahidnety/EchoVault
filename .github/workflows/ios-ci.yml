name: iOS CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build for simulator
        run: xcodebuild -project EchoVault.xcodeproj -scheme EchoVault -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: xcodebuild test -project EchoVault.xcodeproj -scheme EchoVault -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
